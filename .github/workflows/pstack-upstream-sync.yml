name: pstack upstream sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: pstack-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream cursor/plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge and open a pull request or an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: pstack/port/sync-upstream.sh
