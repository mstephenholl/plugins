name: pstack release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Check and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checks and unit tests
        run: |
          python3 pstack/port/check.py
          python3 -m unittest discover -s pstack/port/tests -p 'test_*.py'
      - name: Release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on = 1; next} on && /^## / {exit} on {print}' pstack/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "pstack/CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "pstack $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
